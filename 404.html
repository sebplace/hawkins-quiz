<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page disparue — Hawkins Quiz</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127851;</text></svg>">
<link rel="stylesheet" href="/hawkins-quiz/assets/fonts.css?v=12">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    padding: 2rem 1rem; text-align: center;
    font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; color: #efe6d6;
    background: radial-gradient(120% 90% at 50% -10%, #17121a 0%, #0b0a10 55%, #05060a 100%);
  }
  .kicker {
    margin: 0 0 .6rem; font-size: .72rem; letter-spacing: .42em;
    text-transform: uppercase; color: #8c92a6;
  }
  h1 {
    margin: 0; font-family: "Rozha One", Georgia, serif; font-weight: 400;
    font-size: clamp(4rem, 18vw, 9rem); line-height: .9;
    color: #16060a; -webkit-text-stroke: 2px #e8112d;
    text-shadow: 0 0 12px rgba(232, 17, 45, .55), 0 0 42px rgba(232, 17, 45, .25);
  }
  p.lede { margin: 1.4rem auto 0; max-width: 42ch; color: #9aa0b4; line-height: 1.7; }
  a.btn {
    display: inline-block; margin-top: 2.2rem; text-decoration: none;
    font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    padding: .95rem 1.6rem; border-radius: 999px;
    background: #e8112d; color: #12060a;
  }
  a.btn:hover { box-shadow: 0 0 12px rgba(232, 17, 45, .55), 0 0 42px rgba(232, 17, 45, .25); }
  .wall { display: flex; justify-content: center; gap: 10px; margin-top: 2.6rem; }
  .bulb { width: 11px; height: 11px; border-radius: 50%; background: #3b3128; animation: blink 2.4s infinite; }
  .bulb:nth-child(1) { background: #ff2f45; animation-delay: 0s; }
  .bulb:nth-child(2) { background: #ffc13b; animation-delay: .3s; }
  .bulb:nth-child(3) { background: #3ddc84; animation-delay: .6s; }
  .bulb:nth-child(4) { background: #3aa8ff; animation-delay: .9s; }
  .bulb:nth-child(5) { background: #b14cff; animation-delay: 1.2s; }
  @keyframes blink { 0%, 70%, 100% { opacity: .18; } 80% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .bulb { animation: none; opacity: .8; } }
</style>
</head>
<body>
  <main>
    <p class="kicker">Erreur 404</p>
    <h1>404</h1>
    <p class="lede">
      Cette page a disparu un mardi soir, en rentrant du sous-sol.
      Personne n'a rien vu. Le maire pense que c'était un ours.
    </p>
    <div class="wall" aria-hidden="true">
      <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      <span class="bulb"></span><span class="bulb"></span>
    </div>
    <a class="btn" href="/hawkins-quiz/">Revenir à Hawkins</a>
  </main>
</body>
</html>
